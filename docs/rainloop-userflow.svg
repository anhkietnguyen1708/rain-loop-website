<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Userflow RainLoop</title><desc id="desc">Hai cách khám phá website: điều hướng tự do hoặc trình diễn sáu bước. Thẻ dẫn tới hồ sơ, ảnh phóng lớn và vị trí ứng dụng.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#167D9A"/></marker></defs><rect width="1920" height="1080" fill="#F7FAFC"/><style>text{font-family:'Be Vietnam Pro','DejaVu Sans',sans-serif;fill:#123F35}.title{font-size:54px;font-weight:600}.label{font-size:27px;font-weight:600}.small{font-size:22px;fill:#526759}.meta{font-size:19px;fill:#737D80}.flow{stroke:#167D9A;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><text x="90" y="90" class="title">RainLoop · Userflow</text><text x="90" y="132" class="small">Sơ đồ dành cho slide thuyết trình · phản ánh chức năng thực tế của website</text><rect x="90" y="180" width="340" height="110" rx="20" fill="#D7EB8C" stroke="#CBD9CE"/><text x="114" y="224" class="label">Trang chủ</text><text x="114" y="260" class="small">Vấn đề · Brand · Slogan</text><rect x="520" y="180" width="565" height="110" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="544" y="224" class="label">Khám phá tự do</text><text x="544" y="260" class="small">Menu cố định · đổi mục bất cứ lúc nào</text><rect x="1175" y="180" width="655" height="110" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="1199" y="224" class="label">Trình diễn 6 bước</text><text x="1199" y="260" class="small">Tiếp / Trước · Thoát về điểm bắt đầu</text><path d="M430 235 L520 235" class="flow"/><path d="M260 290 L260 320 L1500 320 L1500 290" class="flow"/><text x="90" y="360" class="label">Sáu mục nội dung / thứ tự trình diễn</text><rect x="90" y="390" width="540" height="115" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="114" y="434" class="label">01 · Trang chủ</text><text x="114" y="470" class="small">Bối cảnh và mục tiêu</text><rect x="685" y="390" width="540" height="115" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="709" y="434" class="label">02 · Nghiên cứu</text><text x="709" y="470" class="small">Thẻ · cơ chế · Moodboard</text><rect x="1280" y="390" width="540" height="115" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="1304" y="434" class="label">03 · Journal</text><text x="1304" y="470" class="small">Quyết định và minh chứng</text><rect x="90" y="540" width="540" height="115" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="114" y="584" class="label">04 · Thiết kế</text><text x="114" y="620" class="small">Sketch · render · hotspot</text><rect x="685" y="540" width="540" height="115" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="709" y="584" class="label">05 · Vật liệu</text><text x="709" y="620" class="small">Hai quy mô · kế hoạch thử</text><rect x="1280" y="540" width="540" height="115" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="1304" y="584" class="label">06 · Đội ngũ</text><text x="1304" y="620" class="small">Vai trò · chuẩn bị bảo vệ</text><path d="M630 447 L685 447" class="flow"/><path d="M1225 447 L1280 447" class="flow"/><path d="M1550 505 L1550 525 L360 525 L360 540" class="flow"/><path d="M630 597 L685 597" class="flow"/><path d="M1225 597 L1280 597" class="flow"/><text x="90" y="725" class="label">Tương tác trong mục Nghiên cứu</text><rect x="90" y="760" width="385" height="115" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="114" y="804" class="label">Lật thẻ</text><text x="114" y="840" class="small">Render + logo → 4 phần</text><rect x="540" y="760" width="575" height="115" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="564" y="804" class="label">Hồ sơ kỹ thuật</text><text x="564" y="840" class="small">Ảnh thật · hệ sinh thái · nguồn</text><rect x="1180" y="760" width="650" height="115" rx="20" fill="#FFFFFF" stroke="#CBD9CE"/><text x="1204" y="804" class="label">Lightbox / Vị trí trên bản vẽ</text><text x="1204" y="840" class="small">Zoom · kéo · đóng → quay về hồ sơ</text><path d="M475 817 L540 817" class="flow"/><path d="M1115 817 L1180 817" class="flow"/><text x="90" y="946" class="small">Đất ngập nước → lớp lọc trên concept. Mao dẫn → kế hoạch kiểm chứng; chưa tích hợp RL-001.</text><text x="90" y="995" class="meta">Không có bước đăng nhập hay bán hàng. Userflow không xuất hiện trên website theo yêu cầu của đề bài.</text></svg>